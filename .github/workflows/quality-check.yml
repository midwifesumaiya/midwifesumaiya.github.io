name: Portfolio quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate CV content and direct PDF generation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path(".")
          cv = (root / "cv.html").read_text(encoding="utf-8")
          generator = (root / "assets/js/cv-download.js").read_text(encoding="utf-8")
          markers = ['data-download-pdf','data-print','id="cv-download-status"','sumaiya.mustakim13@gmail.com','Clinical experience &amp; training','Education','Clinical skills & knowledge areas','Professional registration','Academic reference','pdfmake/0.2.10/pdfmake.min.js','pdfmake/0.2.10/vfs_fonts.js','/assets/js/cv-download.js']
          missing = [x for x in markers if x not in cv]
          if missing:
              raise SystemExit("CV page missing required content/wiring: " + ", ".join(missing))
          if 'href="/cv.pdf"' in cv or 'download="Sumaiya_Akter_Professional_CV.pdf"' in cv:
              raise SystemExit("CV must be generated from cv.html, not linked to a separate PDF.")
          js_markers = ['window.pdfMake.createPdf(build()).download("Sumaiya_Akter_Professional_CV.pdf")','panel("experience-heading")','panel("education-heading")','panel("skills-heading")','Language proficiency','Career direction','Academic reference']
          missing = [x for x in js_markers if x not in generator]
          if missing:
              raise SystemExit("PDF generator missing required features: " + ", ".join(missing))
          for path in ["index.html","about.html","portfolio.html","learning.html","development.html","cv.html"]:
              if not (root / path).is_file():
                  raise SystemExit(f"Missing public page: {path}")
          print("CV content and direct PDF generation checks passed.")
          PY
      - name: Check local navigation targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = [Path(p) for p in ["index.html","about.html","portfolio.html","learning.html","development.html","cv.html"]]
          missing = set()
          for page in pages:
              html = page.read_text(encoding="utf-8")
              for target in re.findall(r'(?:href|src)="(/[^"#?]*)"', html):
                  if target != "/" and not Path(target.lstrip("/")).exists():
                      missing.add(f"{page}: {target}")
          if missing:
              raise SystemExit("Missing local assets/targets:\\n" + "\\n".join(sorted(missing)))
          print("Local navigation and asset targets passed.")
          PY
