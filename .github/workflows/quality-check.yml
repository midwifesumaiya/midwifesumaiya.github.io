name: Portfolio quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate CV download and PDF integrity
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          cv = (root / "cv.html").read_text(encoding="utf-8")
          pdf = (root / "cv.pdf").read_bytes()
          required_cv_markers = [
              'href="/cv.pdf"',
              'download="Sumaiya_Akter_Professional_CV.pdf"',
              'data-print',
              'sumaiya.mustakim13@gmail.com',
              'Clinical experience &amp; training',
              'Education',
              'Clinical skills &amp; knowledge areas',
          ]
          missing = [marker for marker in required_cv_markers if marker not in cv]
          if missing:
              raise SystemExit("CV page is missing required content: " + ", ".join(missing))
          if not pdf.startswith(b"%PDF-"):
              raise SystemExit("cv.pdf does not start with a valid PDF signature")
          if b"%%EOF" not in pdf[-1024:]:
              raise SystemExit("cv.pdf is missing its PDF end marker")
          if b"startxref" not in pdf[-1024:]:
              raise SystemExit("cv.pdf is missing its cross-reference pointer")
          if len(pdf) < 1000:
              raise SystemExit("cv.pdf is unexpectedly small")
          for path in ["index.html", "about.html", "portfolio.html", "learning.html", "development.html", "cv.html"]:
              if not (root / path).is_file():
                  raise SystemExit(f"Missing expected public page: {path}")
          print(f"CV HTML checks passed; PDF signature, EOF, and xref markers passed ({len(pdf)} bytes).")
          PY
      - name: Check local navigation targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = [Path(p) for p in ["index.html", "about.html", "portfolio.html", "learning.html", "development.html", "cv.html"]]
          missing = set()
          for page in pages:
              html = page.read_text(encoding="utf-8")
              for target in re.findall(r'(?:href|src)="(/[^"#?]*)"', html):
                  if target == "/":
                      continue
                  local = Path(target.lstrip("/"))
                  if not local.exists():
                      missing.add(f"{page}: {target}")
          if missing:
              raise SystemExit("Missing local assets/targets:\n" + "\n".join(sorted(missing)))
          print("Local navigation and asset targets passed.")
          PY
